<!-- =====================================================================
     SNIPPET - "Artists, Get Reviewed" CTA
     Reusable block. Drop it near the bottom of any page that should push
     submissions. It is on 10 pages in the design.

     CLASS MATTERS: the container is  class="cc cc-review"  -- both.
       cc         = the shared CTA panel (padding, radius, red glow)
       cc-review  = adds the Can You Dig It!? studio photo behind it
     The same .cc panel is also used for "Powered by ChannelCast" on the
     homepage and "Never Miss a Drop" on Weekly Interrupt. Those must NOT get
     cc-review, or they end up with a music-review studio behind a platform
     pitch.

     ASSET: /images/cta-review.jpg  (upload once, used by every instance)

     LINKS: both point at the Contact page so this works unchanged from any
     page. On the Contact page itself you can shorten the first one to
     "#contact-form" so it scrolls instead of reloading -- optional.
     Repoint BlackMarkerTV-3-*.html to the CMS URLs as those pages go up.
     ===================================================================== -->

<section class="section wrap">
  <div class="cc cc-review">
    <div class="cc-txt">
      <div class="cc-eye">Artists &mdash; Get Reviewed</div>
      <h2 class="cc-h">Think your record<br>can hang?</h2>
      <p class="cc-p">Drop a video link and we&rsquo;ll put it in front of the panel on <b>Can You Dig It!?</b> &mdash; the
      live music review show. Honest feedback, on air, in front of the network.</p>
      <div class="cc-actions">
        <a class="btn btn-red" href="BlackMarkerTV-3-CONTACT.html#contact-form">Submit Your Music</a>
        <a class="btn btn-ghost" href="BlackMarkerTV-3-CAN-YOU-DIG-IT.html">Watch the Show</a>
      </div>
    </div>
  </div>
</section>
