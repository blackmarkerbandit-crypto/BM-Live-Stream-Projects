<!-- =====================================================================
     BlackMarker.TV 3.0 - SITE-WIDE FOOTER SCRIPT
     Replace your existing footer script snippet with this whole block.
     Runs on every page. Nothing else in the footer template changes.

     Four independent pieces, in order:
       1. Subscribe modal   - opened by any .open-sub button (header + footer)
       2. Page title        - moves the CMS h1 into the hero  [NEW]
       3. Active nav item   - works out the black block from the URL
       4. Mobile menu       - hamburger, slide-in panel, tap-to-expand submenus
       5. Share button      - native share sheet, or copy the link

     Every lookup is guarded, so a page missing any of these elements costs
     nothing rather than throwing and killing the rest of the script.

     The ONLY change from the version you have is piece 2. Everything else is
     byte-identical.
     ===================================================================== -->

<script>
(function(){
  // Subscribe modal &mdash; opened by any .open-sub button (header and footer both have one)
  var subModal = document.getElementById('subModal');
  if (subModal) {
    document.querySelectorAll('.open-sub').forEach(function(b){
      b.addEventListener('click', function(){ subModal.classList.add('open'); });
    });
    var closeSub = document.getElementById('closeSub');
    if (closeSub) closeSub.addEventListener('click', function(){ subModal.classList.remove('open'); });
    subModal.addEventListener('click', function(e){ if (e.target === subModal) subModal.classList.remove('open'); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') subModal.classList.remove('open'); });
  }

  // Page title.
  //
  // The CMS prints the page title as <h1><pagetitle>...</pagetitle></h1> as the
  // FIRST thing inside .page-body -- above our hero, with no styling. Meanwhile
  // the hero's own title slot is a CMS macro that renders empty. So every page
  // ends up with a bare heading floating above the band and a hole where the
  // headline should be.
  //
  // This moves the real h1 into the slot. The heading lands where the design
  // puts it, keeps its h1 semantics rather than being duplicated into a div,
  // and on calendar detail pages it carries the event name automatically --
  // which is the whole reason not to hardcode a title in the body.
  //
  // If the page DOES supply its own title, the CMS h1 is then a duplicate
  // sitting above the band, so it is hidden rather than left to stack two
  // headings on the page.
  (function () {
    var h1 = document.querySelector('.page-body > h1');
    if (!h1) return;
    var slot = document.querySelector('.page-hero .pg-title');

    if (slot && !slot.textContent.trim()) {
      h1.classList.add('pg-title');
      slot.parentNode.replaceChild(h1, slot);   // move it into the hero
      return;
    }
    if (slot) h1.style.display = 'none';        // hero already has a title
  })();

  // Active nav item (the black block).
  //
  // In the preview each page hardcoded class="on" into its own copy of the
  // nav. With one shared header template that is impossible -- every page
  // would light up the same link. This works it out from the current URL
  // instead, so the header stays identical on every page.
  //
  // IT DEFERS TO THE SERVER. If the CMS can emit class="on" itself, it wins
  // and this does nothing -- so moving to a template conditional later needs
  // no change here.
  //
  // Convention kept from the preview: a submenu match lights up its PARENT
  // ("Exclusive Shows"), not the child.
  (function () {
    var nav = document.getElementById('mainNav');
    if (!nav || nav.querySelector('a.on')) return;   // server already decided

    function norm(p) {
      try { p = decodeURIComponent(p); } catch (e) {}
      p = p.toLowerCase().split('?')[0].split('#')[0];
      p = p.replace(/\/(index|default|home)\.(html?|php|aspx)$/, '/');
      p = p.replace(/\.(html?|php|aspx)$/, '');
      if (p.length > 1) p = p.replace(/\/+$/, '');
      return p || '/';
    }

    var here = norm(location.pathname);
    var best = null, bestLen = -1;

    nav.querySelectorAll('a[href]').forEach(function (a) {
      var raw = a.getAttribute('href');
      if (!raw || raw.charAt(0) === '#') return;         // dropdown parents
      var path;
      try { path = norm(new URL(a.href, location.href).pathname); }
      catch (e) { return; }

      // exact match wins outright; otherwise prefer the longest section
      // prefix, so /shows/talking-tipsy can light up a /shows entry
      var score = -1;
      if (path === here) score = 1000;
      else if (path !== '/' && here.indexOf(path + '/') === 0) score = path.length;

      if (score > bestLen) { bestLen = score; best = a; }
    });

    if (!best) return;
    var sub = best.closest ? best.closest('.has-sub') : null;
    (sub ? sub.querySelector(':scope > a') || best : best).classList.add('on');
  })();

  // Mobile menu.
  //
  // Two things the desktop nav cannot do on a touch screen, both handled here:
  //   * The panel itself has no open state -- CSS alone cannot toggle it.
  //   * The dropdowns are :hover-based. On touch, tapping "Exclusive Shows"
  //     fires hover and follows its href in the same gesture, so the submenu
  //     can never be reached. Below the breakpoint the parent link's default
  //     is prevented and the tap expands the section instead.
  var burger = document.getElementById('navBurger');
  var mainNav = document.getElementById('mainNav');
  if (burger && mainNav) {
    var MOBILE = window.matchMedia('(max-width:900px)');

    function setMenu(open) {
      document.body.classList.toggle('nav-open', open);
      burger.setAttribute('aria-expanded', String(open));
      if (!open) {
        mainNav.querySelectorAll('.has-sub.open').forEach(function (s) {
          s.classList.remove('open');
        });
      }
    }

    burger.addEventListener('click', function () {
      setMenu(!document.body.classList.contains('nav-open'));
    });

    // tap a dropdown parent to expand it, instead of following its href
    mainNav.querySelectorAll('.has-sub > a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (!MOBILE.matches) return;              // desktop keeps hover
        e.preventDefault();
        var sub = a.parentNode;
        var wasOpen = sub.classList.contains('open');
        mainNav.querySelectorAll('.has-sub.open').forEach(function (s) {
          if (s !== sub) s.classList.remove('open');
        });
        sub.classList.toggle('open', !wasOpen);
      });
    });

    // a real destination closes the menu behind it
    mainNav.querySelectorAll('a[href]').forEach(function (a) {
      a.addEventListener('click', function () {
        if (a.getAttribute('href') === '#') return;
        setMenu(false);
      });
    });

    // tapping the dimmed backdrop closes it -- the overlay is a ::after on
    // body, so anything outside the panel counts
    document.addEventListener('click', function (e) {
      if (!document.body.classList.contains('nav-open')) return;
      if (mainNav.contains(e.target) || burger.contains(e.target)) return;
      setMenu(false);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setMenu(false);
    });

    // resizing past the breakpoint must not leave the page scroll-locked
    // with a panel that is no longer visible
    var onChange = function () { if (!MOBILE.matches) setMenu(false); };
    if (MOBILE.addEventListener) MOBILE.addEventListener('change', onChange);
    else if (MOBILE.addListener) MOBILE.addListener(onChange);
  }

  // Share button &mdash; native share sheet where available, otherwise copy the link
  var shareBtn = document.getElementById('shareBtn');
  if (shareBtn) {
    shareBtn.addEventListener('click', function(){
      var url = 'https://www.blackmarker.tv';
      if (navigator.share) {
        navigator.share({ title: 'Black Marker TV &mdash; The Free Loop', url: url }).catch(function(){});
      } else {
        var l = document.getElementById('shareLbl');
        var o = l ? l.textContent : '';
        if (navigator.clipboard) navigator.clipboard.writeText(url);
        if (l) { l.textContent = 'Link Copied!'; setTimeout(function(){ l.textContent = o; }, 1600); }
      }
    });
  }
})();
</script>
