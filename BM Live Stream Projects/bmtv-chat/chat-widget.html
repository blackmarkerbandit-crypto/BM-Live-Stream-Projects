<!-- =====================================================================
     BlackMarker.TV live chat — site widget
     Paste this block at the END of any page that contains the chat markup
     (#chatBody, #chatInput, #chatSend). It is self-contained.

     The anon key below is MEANT to be public — it ships in every visitor's
     browser. Every rule that matters lives in the database (RLS + triggers),
     so this file being readable gives nobody any power. Never put the
     service_role key here; that one bypasses all of it.
     ===================================================================== -->

<style>
  /* ===============================================================
     PANEL SHELL — the chat's own look, owned here rather than
     copied into every page that hosts it.

     The host page owns LAYOUT only: where the panel sits, how wide
     its column is, what happens at its breakpoints. Everything
     below is the widget's own UI and travels with it.

     Scoped under .chat on purpose. `.msg` and `.sys-msg` are
     generic enough to collide -- the 3.0 Live page already uses
     `.msg` for its top promo banner -- so nothing here escapes the
     panel.

     Assumes the host defines the site variables (--red, --surface,
     --border, --border2, --text, --muted, --muted2).
     =============================================================== */
  .chat{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
    border:1px solid var(--border);background:var(--surface);min-width:0;}
  .chat-head{display:flex;align-items:center;gap:9px;padding:13px 15px;
    border-bottom:1px solid var(--border);}
  .chat-head .t{font-weight:800;font-size:13px;}
  .chat-head .cnt{margin-left:auto;color:var(--muted);font-size:11.5px;font-weight:600;}
  .chat-body{overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:12px;}
  .chat .msg{font-size:13px;line-height:1.45;}
  .chat .msg .u{font-weight:800;margin-right:6px;}
  .chat .msg .txt{opacity:.92;}
  .chat .sys-msg{font-size:11.5px;color:var(--muted2);text-align:center;font-style:italic;}
  .chat-foot{border-top:1px solid var(--border);padding:11px;display:flex;gap:8px;}
  .chat-foot input{flex:1;background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;color:var(--text);font:inherit;font-size:13px;outline:none;}
  .chat-foot input:focus{border-color:var(--red);}
  .chat-send{background:var(--red);border:none;color:#fff;border-radius:8px;
    padding:0 14px;font-weight:800;cursor:pointer;}

  /* name bar -- only shown until the visitor has picked a name */
  .chat-name{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);align-items:center;}
  .chat-name.hide{display:none;}
  .chat-name input{flex:1;min-width:0;background:#100d0b;border:1px solid var(--border);border-radius:7px;
    padding:8px 11px;color:var(--text);font:inherit;font-size:13px;}
  .chat-name button{background:var(--red);border:0;border-radius:7px;padding:8px 13px;color:#fff;
    font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .chat-as{padding:6px 12px 0;font-size:11.5px;color:var(--muted);}
  .chat-as.hide{display:none;}
  .chat-as b{color:var(--text);}
  .chat-as a{color:var(--red);cursor:pointer;text-decoration:none;margin-left:6px;}

  /* a message that a moderator has put on air */
  .chat .msg .onair{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.09em;
    background:var(--red);color:#fff;border-radius:3px;padding:1px 5px;margin-right:6px;vertical-align:1px;}
  .chat .msg .vtick{color:var(--red);margin-left:3px;font-size:10px;vertical-align:1px;}

  .chat-head .cnt.connecting{color:var(--muted);}
  .chat-head .cnt.online{color:#57D9A3;}
  .chat-head .cnt.down{color:#ff6b6b;}

  /* ---------------------------------------------------------------
     Message list fills the panel — no dead space under the send box.

     The host page sizes the PANEL (.chat); these rules size the list
     inside it, so one rule governs instead of every page guessing a
     pixel height. min-height:0 is the load-bearing one: a flex child
     defaults to min-height:auto, which refuses to shrink below its
     content, so without it the list pushes the composer off the
     bottom instead of scrolling.
     --------------------------------------------------------------- */
  .chat-body{
    flex:1 1 auto;
    min-height:0;
    max-height:none;
  }

  /* ---------------------------------------------------------------
     Scrollbar, matched to the .rail treatment already used elsewhere
     on the site (8px, --border2 thumb, rounded) so it reads as part
     of the same UI rather than the browser's default bolted on.

     Track is transparent and the thumb is inset by a transparent
     border, so it floats in the panel's own padding instead of
     drawing a channel down the edge.
     --------------------------------------------------------------- */
  .chat-body{
    scrollbar-width:thin;                          /* Firefox */
    scrollbar-color:var(--border2) transparent;    /* thumb, track */
    overscroll-behavior:contain;                   /* don't scroll the page at the ends */
  }
  .chat-body::-webkit-scrollbar{width:10px;}
  .chat-body::-webkit-scrollbar-track{background:transparent;}
  .chat-body::-webkit-scrollbar-thumb{
    background:var(--border2);
    border-radius:6px;
    border:2px solid transparent;
    background-clip:padding-box;
  }
  .chat-body::-webkit-scrollbar-thumb:hover{
    background:var(--muted2);
    background-clip:padding-box;
  }
  .chat-body::-webkit-scrollbar-thumb:active{
    background:var(--red);
    background-clip:padding-box;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://eyqtvdwchwfomhkfjimv.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cXR2ZHdjaHdmb21oa2ZqaW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTgyNzEsImV4cCI6MjEwMjM5NDI3MX0.8J_Mi9sOt4-BP8NOF2NHkkPcHnN4fXL8p0bUzbn8qu0';

  var body  = document.getElementById('chatBody');
  var input = document.getElementById('chatInput');
  var send  = document.getElementById('chatSend');
  if (!body || !input || !send || !window.supabase) return;

  /* ---------- which room ----------
     Precedence is deliberate. A page that states its room wins over
     anything in the URL, so a visitor cannot retype ?room= on the Live
     page and land in a PPV chat. The URL is only consulted when the host
     page has not pinned one — which is the iframe-embed case.

         <div class="chat" data-room="ppv-2026-11-14">   page pins it
         window.BMTV_CHAT_ROOM = 'ppv-2026-11-14'        script pins it
         ...chat.html?room=ppv-2026-11-14                embed picks it
         (nothing)                                       'main'

     The server decides what a room actually permits; this only chooses
     which one to ask for. */
  var panel = body.closest ? body.closest('.chat') : null;
  var room =
      (panel && panel.getAttribute('data-room')) ||
      window.BMTV_CHAT_ROOM ||
      (new URLSearchParams(location.search)).get('room') ||
      'main';
  room = String(room).trim().toLowerCase();
  if (!/^[a-z0-9][a-z0-9_-]{1,60}$/.test(room)) room = 'main';

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  var me = null;                       // our user_id once signed in
  var seen = Object.create(null);      // id -> element, so updates can find rows

  /* ---------- small helpers ---------- */
  var PALETTE = ['#E8181C','#FFC21E','#37E0C8','#7C9CFF','#FF8A3D','#57D9A3'];
  function colorFor(id) {              // same person, same colour, every session
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function status(text, cls) {
    var c = document.querySelector('.chat-head .cnt');
    if (c) { c.textContent = text; c.className = 'cnt ' + (cls || ''); }
  }
  function sysMsg(text) {
    var d = document.createElement('div');
    d.className = 'sys-msg';
    d.textContent = text;
    body.appendChild(d);
    body.scrollTop = body.scrollHeight;
  }
  function atBottom() {
    return body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  }

  /* ---------- rendering ---------- */
  function render(m) {
    if (seen[m.id]) { update(m); return; }
    var stick = atBottom();

    var el = document.createElement('div');
    el.className = 'msg';

    var u = document.createElement('span');
    u.className = 'u';
    u.style.color = colorFor(m.user_id);
    u.textContent = m.display_name;
    if (m.is_verified) {
      var v = document.createElement('span');
      v.className = 'vtick'; v.textContent = '✓'; v.title = 'Verified account';
      u.appendChild(v);
    }

    var t = document.createElement('span');
    t.className = 'txt';
    t.textContent = m.body;

    el.appendChild(u);
    el.appendChild(t);
    seen[m.id] = el;
    body.appendChild(el);
    if (m.status === 'released') update(m);
    if (stick) body.scrollTop = body.scrollHeight;
  }

  function update(m) {
    var el = seen[m.id];
    if (!el) return;
    if (m.status === 'hidden') {        // moderator killed it -- vanish everywhere
      el.remove();
      delete seen[m.id];
      return;
    }
    var tag = el.querySelector('.onair');
    if (m.status === 'released' && !tag) {
      tag = document.createElement('span');
      tag.className = 'onair';
      tag.textContent = 'ON AIR';
      el.insertBefore(tag, el.firstChild);
    } else if (m.status !== 'released' && tag) {
      tag.remove();
    }
  }

  /* ---------- display name ---------- */
  var nameKey = 'bmtv-chat-name';
  var myName = null;
  try { myName = localStorage.getItem(nameKey); } catch (e) {}

  var foot = document.querySelector('.chat-foot');
  var nameBar = document.createElement('div');
  nameBar.className = 'chat-name';
  nameBar.innerHTML =
    '<input maxlength="40" placeholder="Pick a name to chat as…" aria-label="Display name">' +
    '<button type="button">Set</button>';
  var asBar = document.createElement('div');
  asBar.className = 'chat-as';
  foot.parentNode.insertBefore(nameBar, foot);
  foot.parentNode.insertBefore(asBar, foot);

  var nameInput = nameBar.querySelector('input');
  var nameBtn = nameBar.querySelector('button');

  function paintName() {
    if (myName) {
      nameBar.classList.add('hide');
      asBar.classList.remove('hide');
      asBar.innerHTML = '';
      asBar.appendChild(document.createTextNode('Chatting as '));
      var b = document.createElement('b'); b.textContent = myName; asBar.appendChild(b);
      var a = document.createElement('a'); a.textContent = 'change';
      a.addEventListener('click', function () { myName = null; paintName(); nameInput.focus(); });
      asBar.appendChild(a);
      input.placeholder = 'Say something…';
      input.disabled = false;
      send.disabled = false;
    } else {
      nameBar.classList.remove('hide');
      asBar.classList.add('hide');
      input.placeholder = 'Pick a name first…';
      input.disabled = true;
      send.disabled = true;
    }
  }
  function setName() {
    var v = nameInput.value.trim().slice(0, 40);
    if (!v) { nameInput.focus(); return; }
    myName = v;
    try { localStorage.setItem(nameKey, v); } catch (e) {}
    paintName();
    input.focus();
  }
  nameBtn.addEventListener('click', setName);
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') setName(); });
  paintName();

  /* ---------- sending ---------- */
  var sending = false;
  function post() {
    var v = input.value.trim();
    if (!v || !me || !myName || sending) return;
    sending = true;
    var keep = v;
    input.value = '';
    sb.from('messages').insert({ user_id: me, display_name: myName, body: keep, room: room })
      .then(function (res) {
        sending = false;
        if (!res.error) return;
        var msg = String(res.error.message || '');
        if (msg.indexOf('rate_limited') >= 0)      sysMsg('Slow down a second — too many messages at once.');
        else if (msg.indexOf('banned') >= 0)       sysMsg('You are not able to post in this chat.');
        else                                       sysMsg('Message did not send. Try again.');
        input.value = keep;   // give them their text back rather than losing it
      });
  }
  send.addEventListener('click', post);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') post(); });

  /* ---------- start ---------- */
  status('connecting…', 'connecting');

  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) return r.data.session;
    return sb.auth.signInAnonymously().then(function (r2) {
      if (r2.error) throw r2.error;
      return r2.data.session;
    });
  }).then(function (session) {
    me = session.user.id;
    // a real (non-anonymous) sign-in gets the verified tick
    var anon = !session.user.email && !session.user.phone;
    if (!anon) { /* is_verified is set server-side later if we add real auth */ }

    return sb.from('messages')
      .select('id,user_id,display_name,body,status,is_verified')
      .eq('room', room)
      .neq('status', 'hidden')
      .order('id', { ascending: false })
      .limit(50);
  }).then(function (res) {
    if (res.error) throw res.error;
    body.innerHTML = '';
    sysMsg('Welcome to BlackMarker.TV — keep it respectful.');
    (res.data || []).slice().reverse().forEach(render);
    body.scrollTop = body.scrollHeight;

    /* Filter server-side on room, and give the channel a per-room name.
       Without the filter every room's traffic reaches every client and the
       browser quietly decides what to show — which is exactly the kind of
       leak between rooms that must not depend on client-side code. */
    sb.channel('bmtv-chat-' + room)
      .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + room },
          function (p) { render(p.new); })
      .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'messages', filter: 'room=eq.' + room },
          function (p) { update(p.new); })
      .subscribe(function (s) {
        if (s === 'SUBSCRIBED')            status('live', 'online');
        else if (s === 'CHANNEL_ERROR')    status('reconnecting…', 'down');
      });
  }).catch(function (e) {
    status('chat offline', 'down');
    sysMsg('Chat is unavailable right now.');
    if (window.console) console.warn('chat init failed:', e);
  });
})();
</script>
